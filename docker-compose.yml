services:
  api:
    image: ghcr.io/daskol/typst-telegram-bot:0.2.1
    build: .
    command: 'python -m typst_telegram serve api -d data -e http://api:8080 -i 0.0.0.0'
    security_opt:
      - 'no-new-privileges:true'
    user: 'nobody:nobody'
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - './data:/workspace/data'
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  bot:
    image: ghcr.io/daskol/typst-telegram-bot:0.2.1
    build: .
    command: 'python -m typst_telegram serve bot -e http://api:8080'
    environment:
      - 'TELEGRAM_BOT_API_TOKEN'
    security_opt:
      - 'no-new-privileges:true'
    user: 'nobody:nobody'
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  internal:
    driver: bridge
